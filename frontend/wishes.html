<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070b16">
    <title>ForGF | Wishes</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #010409;
        --panel: rgba(13, 17, 23, 0.72);
        --panel-strong: rgba(22, 27, 34, 0.86);
        --line: rgba(139, 148, 158, 0.24);
        --text: #f0f6fc;
        --muted: #8b949e;
        --cyan: #7ee7ff;
        --pink: #ff7eb6;
        --green: #56d364;
        --shadow: 0 28px 90px rgba(1, 4, 9, 0.52);
        --serif: Georgia, "Times New Roman", serif;
        --sans: "Trebuchet MS", "Avenir Next", Verdana, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: clamp(18px, 4vw, 42px);
        overflow: hidden;
        font-family: var(--sans);
        color: var(--text);
        background:
          radial-gradient(circle at 18% 80%, rgba(126, 231, 255, 0.14), transparent 30%),
          radial-gradient(circle at 78% 18%, rgba(255, 126, 182, 0.16), transparent 28%),
          linear-gradient(180deg, #010409 0%, #070b16 52%, #0d1117 100%);
      }

      .star-field,
      .star-field::before,
      .star-field::after,
      .star-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .star-field {
        overflow: hidden;
      }

      .star-field::before,
      .star-field::after,
      .star-layer {
        content: "";
        background-repeat: repeat;
      }

      .star-field::before {
        background-image:
          radial-gradient(circle, rgba(255, 255, 255, 0.86) 0 1px, transparent 1.6px),
          radial-gradient(circle, rgba(126, 231, 255, 0.58) 0 1px, transparent 1.7px),
          radial-gradient(circle, rgba(255, 126, 182, 0.44) 0 1px, transparent 1.6px);
        background-position: 18px 22px, 92px 76px, 46px 118px;
        background-size: 86px 86px, 128px 128px, 164px 164px;
        opacity: 0.6;
      }

      .star-field::after {
        background-image:
          radial-gradient(circle, rgba(255, 126, 182, 0.72) 0 1px, transparent 1.8px),
          radial-gradient(circle, rgba(255, 255, 255, 0.55) 0 1px, transparent 1.6px),
          radial-gradient(circle, rgba(126, 231, 255, 0.42) 0 1px, transparent 1.6px);
        background-position: 54px 38px, 126px 148px, 8px 86px;
        background-size: 150px 150px, 112px 112px, 190px 190px;
        opacity: 0.44;
        animation: star-drift 18s linear infinite;
      }

      .star-layer-a {
        background-image: radial-gradient(circle, rgba(255, 255, 255, 0.64) 0 1px, transparent 1.8px);
        background-size: 64px 64px;
        background-position: 12px 40px;
        opacity: 0.36;
        animation: sparkle-drift 11s ease-in-out infinite alternate;
      }

      .star-layer-b {
        background-image: radial-gradient(circle, rgba(126, 231, 255, 0.52) 0 1px, transparent 1.8px);
        background-size: 96px 96px;
        background-position: 86px 8px;
        opacity: 0.34;
        animation: sparkle-drift 15s ease-in-out infinite alternate-reverse;
      }

      .comet {
        position: fixed;
        width: 112px;
        height: 1px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.88), transparent);
        opacity: 0;
        transform: rotate(-28deg);
        pointer-events: none;
      }

      .comet-a {
        top: 18%;
        left: 12%;
        animation: comet-pass 7s ease-in-out infinite;
      }

      .comet-b {
        top: 42%;
        right: 8%;
        animation: comet-pass 9s ease-in-out 2s infinite;
      }

      .falling-star {
        position: fixed;
        top: -12vh;
        right: -8vw;
        width: 86px;
        height: 2px;
        border-radius: 999px;
        background:
          linear-gradient(90deg, transparent, rgba(126, 231, 255, 0.72), rgba(255, 255, 255, 0.96));
        box-shadow:
          0 0 16px rgba(126, 231, 255, 0.5),
          0 0 26px rgba(255, 126, 182, 0.22);
        opacity: 0;
        transform: rotate(-34deg);
        animation: falling-star-pass 24s linear infinite;
        animation-delay: -7s;
        pointer-events: none;
      }

      .falling-star::after {
        content: "";
        position: absolute;
        right: 0;
        top: 50%;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #f0f6fc;
        transform: translateY(-50%);
        box-shadow: 0 0 14px rgba(240, 246, 252, 0.72);
      }

      .falling-star-b {
        width: 64px;
        animation-delay: -2s;
        animation-duration: 29s;
      }

      .falling-star-c {
        width: 104px;
        animation-delay: 4s;
        animation-duration: 34s;
      }

      .falling-star-d {
        top: -18vh;
        right: 18vw;
        width: 72px;
        animation-delay: 9s;
        animation-duration: 31s;
      }

      .falling-star-e {
        top: 2vh;
        right: -16vw;
        width: 52px;
        animation-delay: 13s;
        animation-duration: 37s;
      }

      .falling-star-f {
        top: -24vh;
        right: 38vw;
        width: 92px;
        animation-delay: 17s;
        animation-duration: 41s;
      }

      .love-star {
        position: fixed;
        width: 14px;
        height: 14px;
        opacity: 0.52;
        filter: drop-shadow(0 0 12px rgba(255, 126, 182, 0.48));
        animation: love-float 9s ease-in-out infinite alternate;
        pointer-events: none;
      }

      .love-star::before,
      .love-star::after {
        content: "";
        position: absolute;
        width: 8px;
        height: 12px;
        border-radius: 999px 999px 0 0;
        background: rgba(255, 126, 182, 0.68);
        transform-origin: 50% 100%;
      }

      .love-star::before {
        left: 5px;
        transform: rotate(-45deg);
      }

      .love-star::after {
        left: 1px;
        transform: rotate(45deg);
      }

      .love-star-a {
        left: 18%;
        top: 24%;
      }

      .love-star-b {
        right: 18%;
        top: 62%;
        width: 10px;
        height: 10px;
        opacity: 0.4;
        animation-delay: 2s;
      }

      .love-star-c {
        left: 72%;
        top: 16%;
        width: 12px;
        height: 12px;
        opacity: 0.36;
        animation-delay: 4s;
      }

      .frame {
        position: fixed;
        inset: clamp(14px, 3vw, 30px);
        border: 1px solid rgba(139, 148, 158, 0.18);
        pointer-events: none;
      }

      .frame::before {
        content: "";
        position: absolute;
        inset: 14px;
        border-top: 1px solid rgba(126, 231, 255, 0.2);
        border-bottom: 1px solid rgba(255, 126, 182, 0.14);
      }

      .card {
        position: relative;
        z-index: 1;
        width: min(100%, 980px);
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(180px, 280px);
        gap: clamp(22px, 5vw, 54px);
        align-items: center;
        padding: clamp(28px, 6vw, 60px);
        border: 1px solid var(--line);
        border-radius: 34px;
        background:
          linear-gradient(180deg, rgba(22, 27, 34, 0.86), rgba(13, 17, 23, 0.72));
        box-shadow:
          var(--shadow),
          0 0 86px rgba(126, 231, 255, 0.12),
          0 0 108px rgba(255, 126, 182, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        overflow: hidden;
        animation: card-open 760ms cubic-bezier(0.18, 0.84, 0.3, 1) both;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: -35% -20% auto;
        height: 58%;
        background:
          radial-gradient(circle at 50% 0%, rgba(126, 231, 255, 0.22), transparent 42%),
          radial-gradient(circle at 62% 12%, rgba(255, 126, 182, 0.16), transparent 34%);
        pointer-events: none;
      }

      .copy,
      .character-card {
        position: relative;
        z-index: 1;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: var(--green);
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 720px;
        font-family: var(--serif);
        font-size: clamp(2.9rem, 8vw, 6.8rem);
        line-height: 0.92;
        font-weight: 500;
      }

      .name {
        margin: 24px 0 0;
        font-family: var(--serif);
        font-size: clamp(1.35rem, 3.2vw, 2.1rem);
        line-height: 1.18;
        color: rgba(240, 246, 252, 0.94);
      }

      .message {
        max-width: 620px;
        margin: 18px 0 0;
        color: #c9d1d9;
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.75;
      }

      .actions {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 30px;
      }

      .button {
        min-height: 48px;
        padding: 14px 20px;
        border-radius: 999px;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        transition: transform 160ms ease, border-color 160ms ease, background-color 160ms ease;
      }

      .button:hover {
        transform: translateY(-2px);
      }

      .button.primary {
        border: 0;
        background: #f0f6fc;
        color: #0d1117;
      }

      .button.ghost {
        border: 1px solid rgba(139, 148, 158, 0.32);
        background: rgba(13, 17, 23, 0.56);
        color: var(--text);
      }

      .character-card {
        justify-self: center;
        width: min(100%, 280px);
        padding: 18px;
        border: 1px solid rgba(139, 148, 158, 0.22);
        border-radius: 30px;
        background:
          radial-gradient(circle at 50% 18%, rgba(255, 126, 182, 0.18), transparent 32%),
          radial-gradient(circle at 42% 70%, rgba(126, 231, 255, 0.16), transparent 36%),
          var(--panel-strong);
        box-shadow:
          0 20px 60px rgba(1, 4, 9, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .character-card img {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 22px 34px rgba(1, 4, 9, 0.42));
        animation: float-soft 4200ms ease-in-out infinite;
      }

      .caption {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
        text-align: center;
      }

      @media (max-width: 720px) {
        body {
          overflow: auto;
        }

        .card {
          grid-template-columns: 1fr;
          padding: 28px 22px;
        }

        .character-card {
          width: min(78vw, 240px);
          order: -1;
        }

        .actions {
          flex-direction: column;
        }

        .button {
          width: 100%;
        }
      }

      @keyframes card-open {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes float-soft {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      @keyframes star-drift {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(-24px, 18px, 0);
        }
      }

      @keyframes sparkle-drift {
        from {
          transform: translateY(0);
          opacity: 0.18;
        }
        to {
          transform: translateY(16px);
          opacity: 0.42;
        }
      }

      @keyframes comet-pass {
        0%,
        62% {
          opacity: 0;
          transform: translate3d(0, 0, 0) rotate(-28deg);
        }
        68% {
          opacity: 0.85;
        }
        78%,
        100% {
          opacity: 0;
          transform: translate3d(130px, 72px, 0) rotate(-28deg);
        }
      }

      @keyframes falling-star-pass {
        0%,
        22% {
          opacity: 0;
          transform: translate3d(0, 0, 0) rotate(-34deg);
        }
        28% {
          opacity: 0.86;
        }
        56% {
          opacity: 0.7;
        }
        78%,
        100% {
          opacity: 0;
          transform: translate3d(-124vw, 104vh, 0) rotate(-34deg);
        }
      }

      @keyframes love-float {
        from {
          transform: translate3d(0, 0, 0) rotate(-4deg) scale(0.9);
        }
        to {
          transform: translate3d(8px, -14px, 0) rotate(6deg) scale(1.08);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 1ms !important;
          animation-duration: 1ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="star-field" aria-hidden="true">
      <span class="star-layer star-layer-a"></span>
      <span class="star-layer star-layer-b"></span>
      <span class="falling-star falling-star-a"></span>
      <span class="falling-star falling-star-b"></span>
      <span class="falling-star falling-star-c"></span>
      <span class="falling-star falling-star-d"></span>
      <span class="falling-star falling-star-e"></span>
      <span class="falling-star falling-star-f"></span>
      <span class="love-star love-star-a"></span>
      <span class="love-star love-star-b"></span>
      <span class="love-star love-star-c"></span>
      <span class="comet comet-a"></span>
      <span class="comet comet-b"></span>
    </div>
    <div class="frame" aria-hidden="true"></div>

    <main class="card">
      <section class="copy" aria-labelledby="wish-title">
        <p class="eyebrow">opened</p>
        <h1 id="wish-title">You passed.</h1>
        <p class="name" id="success-name">For you.</p>
        <div class="actions">
          <button class="button primary" id="back-button" type="button">Back</button>
          <button class="button ghost" id="stay-button" type="button">Stay</button>
        </div>
      </section>

      <aside class="character-card" aria-label="Night bunny">
        <img src="../data/bunny_character.svg" alt="Cute bunny in a pink winter hood">
      </aside>
    </main>

    <script>
      const OUTCOME_STORAGE_KEY = "forgfLastOutcome";

      function prettifyLabel(label) {
        if (!label) {
          return "Love";
        }

        return label
          .replace(/[_-]+/g, " ")
          .trim()
          .split(/\s+/)
          .filter(Boolean)
          .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
          .join(" ");
      }

      try {
        const raw = window.sessionStorage.getItem(OUTCOME_STORAGE_KEY);
        if (raw) {
          const payload = JSON.parse(raw);
          if (payload && payload.type === "success") {
            document.getElementById("success-name").textContent =
              `${prettifyLabel(payload.label)}.`;
          }
        }
      } catch (_) {
        // Ignore storage errors quietly.
      }

      document.getElementById("back-button").addEventListener("click", () => {
        window.sessionStorage.removeItem(OUTCOME_STORAGE_KEY);
        window.location.href = "./index.html";
      });

      document.getElementById("stay-button").addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    </script>
  </body>
</html>
