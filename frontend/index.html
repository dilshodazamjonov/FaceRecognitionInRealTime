<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070b16">
    <title>ForGF</title>
    <link rel="stylesheet" href="./styles.css?v=13">
  </head>
  <body>
    <main class="app" id="app">
      <section class="screen screen-intro is-active" id="intro-screen" aria-label="Initialization terminal">
        <div class="ambient-frame" aria-hidden="true"></div>
        <div class="intro-halo intro-halo-left" aria-hidden="true"></div>
        <div class="intro-halo intro-halo-right" aria-hidden="true"></div>
        <div class="star-field intro-stars" aria-hidden="true">
          <span class="star-layer star-layer-a"></span>
          <span class="star-layer star-layer-b"></span>
          <span class="falling-star falling-star-a"></span>
          <span class="falling-star falling-star-b"></span>
          <span class="falling-star falling-star-c"></span>
          <span class="falling-star falling-star-d"></span>
          <span class="falling-star falling-star-e"></span>
          <span class="falling-star falling-star-f"></span>
          <span class="love-star love-star-a"></span>
          <span class="love-star love-star-b"></span>
          <span class="love-star love-star-c"></span>
        </div>
        <div class="intro-stage">
          <article class="intro-note">
            <div class="terminal-panel" id="terminal-panel" aria-live="polite"></div>
            <div class="intro-actions">
              <button class="primary-action" id="start-button" type="button">
                Initialize
              </button>
            </div>
          </article>
        </div>
      </section>
    </main>

    <script src="./app.js?v=13" defer></script>
  </body>
</html>
